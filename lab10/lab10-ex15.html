<html>
<head>

   <link rel="stylesheet" href="css/lab10-ex15.css">
   <script src="js/lab10-ex15.js"></script>

<body >

<div class="dashboard">
        <div class="header">
            <h1>Analytics Dashboard</h1>
            <p>Using Google Charts API</p>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Monthly Sales Performance</div>
            <div id="columnChart" class="chart">
                <div class="loading">Loading chart...</div>
            </div>
        </div>
        
        <div class="charts-row">
            <div class="chart-container">
                <div class="chart-title">Market Share Distribution</div>
                <div id="pieChart" class="chart">
                    <div class="loading">Loading chart...</div>
                </div>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">Customer Satisfaction vs Revenue</div>
                <div id="scatterChart" class="chart">
                    <div class="loading">Loading chart...</div>
                </div>
            </div>
        </div>
    </div>   


</body>
</html>
